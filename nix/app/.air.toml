root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # Run both templ generate and CSS build before Go build
  cmd = "templ generate && npm run build:css && go build -o ./tmp/main ./cmd/server"
  delay = 1000
  # "static" excluded: Air's own build cmd writes static/css/output.css; watching it
  # creates an infinite rebuild loop (build -> css write -> retrigger -> build ...)
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "node_modules", "static"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "./tmp/main"
  include_dir = []
  # CSS is intentionally NOT watched: the server binary does not need a rebuild on
  # CSS changes (static assets are re-read per request), and the css/templ watch
  # processes already own that pipeline. Watching css here loops the build.
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
